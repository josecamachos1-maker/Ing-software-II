  <body>
    <button type="button" id="idioma-button">

      <option value="">Selecciona tu género</option>
      <option value="hombre">Hombre</option>
      <option value="mujer">Mujer</option>
    </select>
    <input type="number" id="edad-input" min="0" placeholder="Escribe tu edad" required>
    <input type="submit" value="enviar">
    </form>
  </body>
  <h2 id="saludo"></h2>
